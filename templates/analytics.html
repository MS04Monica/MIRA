<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIRA // Telemetry & AI Analytics</title>

  <!-- EXTERNAL DEPENDENCIES -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- STYLES (MATCHED TO MAIN DASHBOARD) -->
  <style>
    :root {
      --bg-dark: #101216;
      --glass-bg: rgba(22, 26, 33, 0.78);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-blur: blur(16px);
      --theme-yellow: #ffcc00;
      --theme-yellow-glow: rgba(255, 204, 0, 0.35);
      --text-main: #f5f7fa;
      --text-muted: #a0aab8;
      --alert-red: #ff3355;
      --safe-green: #00e676;
      --cyan: #00d2ff;
      --orange: #ff9f43;
      --violet: #8b6cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: linear-gradient(135deg, rgba(16, 18, 22, 0.85) 0%, rgba(20, 24, 30, 0.85) 100%),
                  url("/static/images/mine_image.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.50);
    }

    header.glass-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      margin-bottom: 20px;
      position: sticky;
      top: 15px;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--theme-yellow);
    }

    .nav-brand .badge {
      background: rgba(255, 204, 0, 0.18);
      border: 1px solid var(--theme-yellow);
      color: var(--theme-yellow);
      padding: 3px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 6px;
    }

    .nav-links {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--theme-yellow);
      background: rgba(255, 204, 0, 0.12);
    }

    .card-header {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--theme-yellow);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metrics-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-card label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card .val {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      padding: 20px;
    }

    .chart-wrapper {
      position: relative;
      height: 260px;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th {
      text-align: left;
      padding: 12px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--glass-border);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tag {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .tag-green { background: rgba(0, 230, 118, 0.15); color: var(--safe-green); border: 1px solid var(--safe-green); }
    .tag-yellow { background: rgba(255, 204, 0, 0.15); color: var(--theme-yellow); border: 1px solid var(--theme-yellow); }

    @media (max-width: 900px) {
      .metrics-summary { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION -->
  <header class="glass-navbar glass-card">
    <div class="nav-brand">
      <i class="fa-solid fa-robot" style="font-size: 1.6rem; color: var(--theme-yellow);"></i>
      <div>
        <h1>MIRA</h1>
        <div style="font-size: 0.8rem; color: var(--text-muted);">SURFACE CONTROL & TELEMETRY STATION</div>
      </div>
      <span class="badge">SIH26039</span>
    </div>

    <nav class="nav-links">
      <a href="/" class="nav-link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="/" class="nav-link"><i class="fa-solid fa-video"></i> Camera Stream</a>
      <a href="/analytics" class="nav-link active"><i class="fa-solid fa-chart-line"></i> Analytics</a>
    </nav>
  </header>

  <!-- METRIC STATS OVERVIEW -->
  <div class="metrics-summary">
    <div class="glass-card stat-card">
      <label>Total Detections</label>
      <div class="val" id="stat-detections" style="color: var(--theme-yellow);">--</div>
    </div>
    <div class="glass-card stat-card">
      <label>Avg Temperature</label>
      <div class="val" id="stat-temp" style="color: var(--orange);">-- °C</div>
    </div>
    <div class="glass-card stat-card">
      <label>Peak Gas Level</label>
      <div class="val" id="stat-gas" style="color: var(--cyan);">--</div>
    </div>
    <div class="glass-card stat-card">
      <label>Telemetry Logs</label>
      <div class="val" id="stat-logs" style="color: var(--violet);">--</div>
    </div>
  </div>

  <!-- CHARTS SECTION -->
  <div class="charts-grid">
    <div class="glass-card panel">
      <div class="card-header">
        <span><i class="fa-solid fa-fire-flame-curved"></i> Environmental Trends</span>
      </div>
      <div class="chart-wrapper">
        <canvas id="envTrendChart"></canvas>
      </div>
    </div>

    <div class="glass-card panel">
      <div class="card-header">
        <span><i class="fa-solid fa-eye"></i> AI Detection Volume</span>
      </div>
      <div class="chart-wrapper">
        <canvas id="detectionBarChart"></canvas>
      </div>
    </div>
  </div>

  <!-- LOG TABLE -->
  <div class="glass-card panel">
    <div class="card-header">
      <span><i class="fa-solid fa-list-check"></i> Live Detection & Telemetry Logs</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Sensor Temp</th>
          <th>Sensor Gas</th>
          <th>AI Detected Object</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="analytics-table-body">
        <tr>
          <td colspan="5" style="text-align: center; color: var(--text-muted);">Fetching analytics log...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Shared Chart Config Options
    const chartOptions = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#f5f7fa' } } },
      scales: {
        x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#a0aab8' } },
        y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#a0aab8' } }
      }
    };

    // Environmental Trend Chart Setup
    const ctxEnv = document.getElementById('envTrendChart').getContext('2d');
    const envTrendChart = new Chart(ctxEnv, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Temp (°C)', data: [], borderColor: '#ff9f43', backgroundColor: 'rgba(255, 159, 67, 0.1)', fill: true, tension: 0.3 },
          { label: 'Gas Level', data: [], borderColor: '#00d2ff', backgroundColor: 'rgba(0, 210, 255, 0.1)', fill: true, tension: 0.3 }
        ]
      },
      options: chartOptions
    });

    // AI Detection Volume Chart Setup
    const ctxDet = document.getElementById('detectionBarChart').getContext('2d');
    const detectionBarChart = new Chart(ctxDet, {
      type: 'bar',
      data: {
        labels: [],
        datasets: [{ label: 'Objects Count', data: [], backgroundColor: 'rgba(255, 204, 0, 0.6)', borderColor: '#ffcc00', borderWidth: 1 }]
      },
      options: chartOptions
    });

    let historyLog = [];

    async function fetchAnalyticsData() {
      try {
        const response = await fetch('/detections');
        if (!response.ok) return;

        const data = await response.json();
        const timestamp = new Date().toLocaleTimeString();

        const tempVal = data.telemetry?.temp ?? 0;
        const gasVal = data.telemetry?.gas ?? 0;
        const detectionsCount = data.detections ? data.detections.length : 0;
        const mainClass = detectionsCount > 0 ? data.detections[0].class : "None";

        // Record history snapshot
        historyLog.unshift({ time: timestamp, temp: tempVal, gas: gasVal, object: mainClass, count: detectionsCount });
        if (historyLog.length > 10) historyLog.pop();

        // Update Stat Cards
        document.getElementById('stat-detections').innerText = detectionsCount;
        document.getElementById('stat-temp').innerText = `${tempVal} °C`;
        document.getElementById('stat-gas').innerText = gasVal;
        document.getElementById('stat-logs').innerText = historyLog.length;

        // Update Charts
        if (envTrendChart.data.labels.length > 8) {
          envTrendChart.data.labels.shift();
          envTrendChart.data.datasets[0].data.shift();
          envTrendChart.data.datasets[1].data.shift();
          detectionBarChart.data.labels.shift();
          detectionBarChart.data.datasets[0].data.shift();
        }

        envTrendChart.data.labels.push(timestamp);
        envTrendChart.data.datasets[0].data.push(tempVal);
        envTrendChart.data.datasets[1].data.push(gasVal);
        envTrendChart.update();

        detectionBarChart.data.labels.push(timestamp);
        detectionBarChart.data.datasets[0].data.push(detectionsCount);
        detectionBarChart.update();

        // Render Table
        const tbody = document.getElementById('analytics-table-body');
        tbody.innerHTML = historyLog.map(row => `
          <tr>
            <td>${row.time}</td>
            <td style="color: var(--orange);">${row.temp}°C</td>
            <td style="color: var(--cyan);">${row.gas}</td>
            <td><strong>${row.object}</strong></td>
            <td><span class="tag ${row.count > 0 ? 'tag-yellow' : 'tag-green'}">${row.count > 0 ? 'DETECTED' : 'CLEAR'}</span></td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('[Analytics Fetch Error]', err);
      }
    }

    setInterval(fetchAnalyticsData, 2000);
    fetchAnalyticsData();
  </script>
</body>
</html>
